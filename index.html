<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能任务管理系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .input-area {
      padding: 24px 30px;
      border-bottom: 1px solid #eee;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    #task-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #task-input:focus {
      border-color: #667eea;
    }

    #priority-select {
      padding: 12px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      background: #fff;
    }

    #add-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    #add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #add-btn:active {
      transform: translateY(0);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 16px 30px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #667eea;
      color: #fff;
      border-color: #667eea;
    }

    .task-list {
      list-style: none;
      padding: 16px 30px;
      min-height: 200px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .task-item:hover {
      background: #f8f9ff;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-size: 15px;
      color: #333;
      margin-bottom: 4px;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: #aaa;
    }

    .priority-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .priority-高 {
      background: #ffe0e0;
      color: #e53935;
    }

    .priority-中 {
      background: #fff3e0;
      color: #fb8c00;
    }

    .priority-低 {
      background: #e8f5e9;
      color: #43a047;
    }

    .delete-btn {
      padding: 6px 12px;
      background: transparent;
      color: #999;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: #ffebee;
      color: #e53935;
      border-color: #ffcdd2;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .stats {
      padding: 12px 30px;
      background: #fafafa;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>智能任务管理系统</h1>
      <p>高效管理你的每一天</p>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="task-input" placeholder="输入任务标题..." />
        <select id="priority-select">
          <option value="高">高</option>
          <option value="中" selected>中</option>
          <option value="低">低</option>
        </select>
        <button id="add-btn">添加</button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="高">高优先级</button>
      <button class="filter-btn" data-filter="中">中优先级</button>
      <button class="filter-btn" data-filter="低">低优先级</button>
    </div>

    <ul class="task-list" id="task-list">
      <div class="loading">加载中...</div>
    </ul>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    const API_BASE = '/api/tasks';
    let tasks = [];
    let currentFilter = '全部';

    // 加载任务
    async function loadTasks() {
      try {
        const res = await fetch(API_BASE);
        tasks = await res.json();
        renderTasks();
      } catch (err) {
        document.getElementById('task-list').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div>加载失败，请刷新重试</div>';
      }
    }

    // 渲染任务列表
    function renderTasks() {
      const list = document.getElementById('task-list');
      const filtered = currentFilter === '全部'
        ? tasks
        : tasks.filter(t => t.priority === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">📝</div>暂无任务，添加一条吧</div>';
      } else {
        list.innerHTML = filtered.map(task => `
          <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} />
            <div class="task-content">
              <div class="task-title">${escapeHtml(task.title)}</div>
              <span class="priority-badge priority-${task.priority}">${task.priority}</span>
            </div>
            <button class="delete-btn">删除</button>
          </li>
        `).join('');
      }

      // 更新统计
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      document.getElementById('stats').textContent = `共 ${total} 条任务，已完成 ${done} 条`;

      // 绑定事件
      bindTaskEvents();
    }

    // 绑定任务项事件
    function bindTaskEvents() {
      document.querySelectorAll('.task-checkbox').forEach(cb => {
        cb.addEventListener('change', async (e) => {
          const id = e.target.closest('.task-item').dataset.id;
          const completed = e.target.checked;
          await fetch(`${API_BASE}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed })
          });
          loadTasks();
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.task-item').dataset.id;
          await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
          loadTasks();
        });
      });
    }

    // 添加任务
    async function addTask() {
      const input = document.getElementById('task-input');
      const priority = document.getElementById('priority-select').value;
      const title = input.value.trim();

      if (!title) {
        alert('请输入任务标题');
        return;
      }

      await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, priority })
      });

      input.value = '';
      loadTasks();
    }

    // 工具函数
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 事件绑定
    document.getElementById('add-btn').addEventListener('click', addTask);
    document.getElementById('task-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // 初始化
    loadTasks();
  </script>
</body>
</html>
